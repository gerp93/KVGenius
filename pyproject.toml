[project]
name = "kvgenius"
description = "KVGenius AI Studio - Flet desktop app"

[tool.flet.macos]
# `flet build macos` defaults to a universal build (arm64 + x86_64). PyTorch
# no longer publishes macOS x86_64 (Intel) wheels for recent versions, so the
# x86_64 leg's `pip install -r requirements.txt` fails outright with
# "ERROR: Could not find a version that satisfies the requirement torch>=2.0.0
# (from versions: none)", aborting the whole macOS build. Apple Silicon-only
# matches both current PyTorch support and current Mac hardware (Intel Macs
# are EOL), so restrict the build instead of trying to keep Intel support alive.
target_arch = ["arm64"]
