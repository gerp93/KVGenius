# Typecheck and run the tests on every pull request and every push to main.
# Trigger shape follows KVG_Standards' templates/ci.yml (which is Go-only; there
# is no Electron CI template there yet), so this one runs here, not via workflow_call.
#
# One Linux job is enough: the code under test is plain TypeScript (main process,
# shared logic, React helpers) and needs no Electron binary or display. Node 22 is
# what Electron's bundled Node is (and node:sqlite needs >= 22).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skip lifecycle scripts, as release-electron.yml does: nothing here needs the
      # Electron or esbuild binaries, and skipping saves a large download.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
