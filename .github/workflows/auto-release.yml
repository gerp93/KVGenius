# Fires a release on EVERY push to main - no manual step. Coexists with
# cut-release.yml: this handles the default every-commit-ships case
# (conventional-commit-driven patch/minor/major bump), cut-release.yml
# stays available for a deliberately-numbered release when you want one
# instead of the auto-bumped version.
#
# See gerp93/KVG_Standards/templates/auto-release.yml for the full
# rationale behind this shape.

name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-electron.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
    permissions:
      contents: write
