# Image Model Presets Configuration
# Copy this file to image_model_presets.yaml and customize as needed
# Each model has optimized default settings for best results
# Note: All SD/SDXL models use CLIP with a 77 token limit (hardcoded in architecture)

models:
  Dreamshaper 8:
    id: "Lykon/dreamshaper-8"
    description: "Artistic, great for portraits and fantasy"
    vram: "~4 GB"
    default_steps: 25
    default_guidance: 7.5
    default_width: 512
    default_height: 768
    step_range: [15, 50]
    guidance_range: [5.0, 12.0]
    default_negative: "ugly, deformed, noisy, blurry, distorted, disfigured, bad anatomy, extra limbs, mutated hands, poorly drawn face, mutation, bad proportions, watermark, text"
    tips: "Good for artistic portraits, fantasy scenes. Use 20-30 steps for quality."

  AbsoluteReality:
    id: "Lykon/absolute-reality-1.6525"
    description: "Photorealistic images"
    vram: "~4 GB"
    default_steps: 25
    default_guidance: 7.0
    default_width: 512
    default_height: 768
    step_range: [20, 50]
    guidance_range: [5.0, 10.0]
    default_negative: "cartoon, painting, illustration, drawing, art, sketch, anime, ugly, deformed, noisy, blurry, low quality, bad anatomy, extra limbs, watermark, text"
    tips: "Best for realistic photos. Add 'RAW photo, 8k uhd, dslr' to prompts."

  Realistic Vision V5:
    id: "SG161222/Realistic_Vision_V5.1_noVAE"
    description: "Highly realistic, great for people"
    vram: "~4 GB"
    default_steps: 30
    default_guidance: 7.0
    default_width: 512
    default_height: 768
    step_range: [20, 50]
    guidance_range: [5.0, 10.0]
    default_negative: "(deformed iris, deformed pupils, semi-realistic, cgi, 3d, render, sketch, cartoon, drawing, anime), text, cropped, out of frame, worst quality, low quality, jpeg artifacts, ugly, duplicate, morbid, mutilated, extra fingers, mutated hands, poorly drawn hands, poorly drawn face, mutation, deformed, blurry, dehydrated, bad anatomy, bad proportions, extra limbs, cloned face, disfigured, gross proportions, malformed limbs, missing arms, missing legs, extra arms, extra legs, fused fingers, too many fingers, long neck"
    tips: "Excellent for realistic portraits. Use 'RAW photo, film grain' in prompts."

  Stable Diffusion 1.5:
    id: "stable-diffusion-v1-5/stable-diffusion-v1-5"
    description: "Classic SD 1.5, versatile base model"
    vram: "~4 GB"
    default_steps: 25
    default_guidance: 7.5
    default_width: 512
    default_height: 512
    step_range: [15, 50]
    guidance_range: [5.0, 15.0]
    default_negative: "ugly, blurry, low quality, distorted, deformed"
    tips: "Good all-around model. Works well with most prompts."

  SDXL Turbo:
    id: "stabilityai/sdxl-turbo"
    description: "Ultra-fast generation (1-8 steps)"
    vram: "~7 GB"
    default_steps: 6
    default_guidance: 0.5
    default_width: 1024
    default_height: 1024
    step_range: [1, 8]
    guidance_range: [0.0, 2.0]
    default_negative: "ugly, deformed, noisy, blurry, distorted, disfigured, bad anatomy, wrong anatomy, extra limbs, mutated hands, extra fingers, poorly drawn face, low quality, worst quality"
    tips: "Very fast! Use 4-6 steps for quick results, 6-8 for people. Low guidance (0-1) works best."

  epiCRealism:
    id: "emilianJR/epiCRealism"
    description: "Extremely photorealistic, popular SD 1.5 model"
    vram: "~4 GB"
    default_steps: 25
    default_guidance: 7.0
    default_width: 512
    default_height: 768
    step_range: [20, 50]
    guidance_range: [5.0, 10.0]
    default_negative: "cartoon, painting, illustration, drawing, art, sketch, anime, ugly, deformed, noisy, blurry, low quality, bad anatomy, extra limbs, watermark, text, worst quality, jpeg artifacts, duplicate, morbid, mutilated, extra fingers, mutated hands, poorly drawn hands, poorly drawn face"
    tips: "One of the most popular realistic models. Great for portraits and people. Use 'RAW photo, 8k' in prompts."

