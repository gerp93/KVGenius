# Prompt enhancement templates per style
prompt_templates:
  photorealistic:
    suffix: ", RAW photo, 8k uhd, dslr, soft lighting, high quality, film grain"
    
  artistic:
    suffix: ", masterpiece, best quality, highly detailed, sharp focus, dramatic lighting"
    
  portrait:
    suffix: ", professional portrait, studio lighting, sharp focus, detailed skin texture, 85mm lens"
    
  fantasy:
    suffix: ", fantasy art, highly detailed, dramatic lighting, epic composition, vibrant colors"
