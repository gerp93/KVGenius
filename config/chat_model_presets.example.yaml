# Chat Model Presets Configuration
# Copy this file to chat_model_presets.yaml and customize as needed
# 'id' is the Ollama model tag (must already be pulled - run `ollama pull <id>`,
# or use the in-app Model Manager, which calls `ollama pull` for you).

models:
  Mistral 7B:
    id: "mistral:7b"
    description: "🎭 Solid all-around instruction-following"
    details: "Well-rounded general-purpose model, good instruction following and reasonable roleplay quality out of the box."
    best_for: "General conversation, instruction following"
    params: "7B"

  Dolphin Mistral 7B:
    id: "dolphin-mistral:7b"
    description: "💬 Uncensored chat, strong roleplay"
    details: "Community fine-tune of Mistral focused on open-ended conversation and character roleplay with fewer refusals."
    best_for: "Character roleplay, creative writing"
    params: "7B"

  DeepSeek Coder 6.7B:
    id: "deepseek-coder:6.7b"
    description: "💻 Code-focused model"
    details: "Specialized for programming tasks, code generation, debugging, and technical explanations."
    best_for: "Code generation, debugging, technical explanations"
    params: "6.7B"

  Llama 3.2 3B:
    id: "llama3.2:3b"
    description: "⚡ Fast & lightweight"
    details: "Small, fast option for quick responses when you don't need a large model loaded."
    best_for: "Quick responses, low VRAM usage, casual chat"
    params: "3B"

